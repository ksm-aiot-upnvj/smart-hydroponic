# Production stack: api + client only.
#
# PostgreSQL is NOT part of this project in production. It is deployed as its
# own stack (`database-service-ksm-aiot`, host port 5434 -> container 5432) and
# both stacks join the pre-existing external Docker network `ksm-aiot-network`.
#
# Consequences of the database living in another Compose project:
#   * this file must not declare a `db` service, and
#   * `depends_on` cannot express a cross-project dependency. The api container
#     waits for the database itself (backend/entrypoint.sh) and surfaces
#     readiness through its Dockerfile HEALTHCHECK.
#
# Deploy with the root `.env` for Compose interpolation:
#   docker network create ksm-aiot-network      # once, only if it does not exist
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#   docker compose -f docker-compose.prod.yml ps
#
# Portainer Git stacks should load the production `.env` values into the stack
# environment. This file maps runtime settings explicitly because the Git
# checkout does not contain the ignored `.env` file.
#
# Never run `docker compose down -v` for this file: the named volumes holding
# database data belong to the other project and must survive routine redeploys.
services:
  api:
    # `latest` is a moving tag: two deploys of this same file can run different
    # code. Pin BACKEND_IMAGE_TAG in `.env` to a fixed release tag published by
    # .github/workflows/docker-push-backend.yml (`backend-vX.Y.Z`). This setting
    # accepts a tag, not a digest. See docs/backend/deploy_python.md, "Pin image
    # dan reproduksibilitas rilis".
    image: ksmaiotupnvj/smart-hydroponic-backend:${BACKEND_IMAGE_TAG:-latest}
    container_name: hydroponic-backend
    # Recover from a crashed process or a host reboot, but leave a container the
    # operator stopped on purpose stopped. Docker backs off repeated restarts
    # (doubling the delay up to ~1 minute), so a permanently invalid
    # configuration does not turn into a tight loop — but it is still an
    # unhandled failure that monitoring and `docker compose ps` must surface.
    # A restart policy never replaces alerting.
    restart: unless-stopped
    environment:
      # PROD_PGHOST is the database's DNS name on ksm-aiot-network. Confirm it
      # with `docker network inspect ksm-aiot-network` before the first deploy.
      PGHOST: ${PROD_PGHOST:-database-service-ksm-aiot}
      PGPORT: ${POSTGRES_INTERNAL_PORT:-5432}
      PGUSER: ${PGUSER:?Set PGUSER in the production environment}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in the production environment}
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in the production environment}
      # Blanked so Settings rebuilds the URL from the values above instead of
      # reusing a host-oriented value (e.g. localhost:5433) from `.env`.
      DATABASE_URL: ""
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:?Set JWT_EXPIRES_IN in the production environment}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-keys/private.pem}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-keys/public.pem}
      SUPERUSER_USERNAME: ${SUPERUSER_USERNAME:?Set SUPERUSER_USERNAME in the production environment}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:?Set SUPERUSER_EMAIL in the production environment}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:?Set SUPERUSER_PASSWORD in the production environment}
      SUPERUSER_ROLE: ${SUPERUSER_ROLE:-superadmin}
      DB_STARTUP_MAX_ATTEMPTS: ${DB_STARTUP_MAX_ATTEMPTS:-30}
      DB_STARTUP_RETRY_INTERVAL: ${DB_STARTUP_RETRY_INTERVAL:-2}
      COAP_HOST: "0.0.0.0"
      HYDROPONIC_MIN_INTERVAL_SECONDS: ${HYDROPONIC_MIN_INTERVAL_SECONDS:-0.1}
      HYDROPONIC_PAIR_TIMEOUT_SECONDS: ${HYDROPONIC_PAIR_TIMEOUT_SECONDS:-60.0}
      HYDROPONIC_MOISTURE_THRESHOLD: ${HYDROPONIC_MOISTURE_THRESHOLD:-60}
      HYDROPONIC_TEMPERATURE_THRESHOLD: ${HYDROPONIC_TEMPERATURE_THRESHOLD:-30.0}
      # The production browser reaches this API through the frontend container's
      # nginx (`/smart-hydroponic/` -> api:8000, see frontend-vue/nginx.conf), so
      # requests are same-origin and no CORS header is required. This is
      # deliberately NOT taken from `.env`'s CORS_ALLOW_ORIGINS, whose default is
      # the wildcard "*" used for local development. Leave
      # PROD_CORS_ALLOW_ORIGINS empty for the same-origin deployment; set it to an
      # explicit comma-separated list of origins only if the API really is called
      # cross-origin. An empty list means no cross-origin access at all.
      CORS_ALLOW_ORIGINS: ${PROD_CORS_ALLOW_ORIGINS:-}
    # Bound to loopback on purpose: the host NGINX (site `iot-hidroponik`)
    # terminates TLS and proxies /smart-hydroponic/api/v2/ to 127.0.0.1:8000.
    # Publishing the HTTP API on 0.0.0.0 would expose it directly.
    # ESP firmware connects to the server's public IP on UDP 8683, so that
    # CoAP port must remain externally reachable; restrict its source in the
    # provider firewall when device addresses are stable.
    ports:
      - "127.0.0.1:8000:8000"
      - "8683:8683/udp"
    volumes:
      # Required: backend/utils/crypto.py reads these files at import time and
      # raises RuntimeError if they are missing. The host directory is outside
      # the Portainer Git checkout because `keys/` is not committed.
      - type: bind
        source: "${PROD_KEYS_DIR:?Set PROD_KEYS_DIR to the host keys directory}"
        target: /app/keys
        read_only: true
      # Preserve the current host-managed entrypoint during migration. It
      # intentionally overrides the image entrypoint and must be reconciled
      # before this mount is removed.
      - type: bind
        source: "${PROD_ENTRYPOINT_PATH:?Set PROD_ENTRYPOINT_PATH to the host entrypoint file}"
        target: /app/entrypoint.sh
        read_only: true
    networks:
      - ksm-aiot-network

  client:
    # Same reasoning as the api image above: pin FRONTEND_IMAGE_TAG to a release
    # tag (`frontend-vX.Y.Z`) instead of relying on the moving `latest` tag.
    image: ksmaiotupnvj/smart-hydroponic-frontend:${FRONTEND_IMAGE_TAG:-latest}
    container_name: hydroponic-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    networks:
      - ksm-aiot-network

networks:
  ksm-aiot-network:
    name: ksm-aiot-network
    external: true

[pytest]
# pytest reads only the nearest inifile on the upward path from the invocation
# directory. When invoked from the repository root it never reaches
# backend/pyproject.toml, which leaves the custom marks unregistered and emits
# PytestUnknownMarkWarning. Keep this markers list in sync with
# backend/pyproject.toml [tool.pytest.ini_options].
testpaths = backend/test

markers =
    real_lifespan: run the test against the app's real startup lifespan (CoAP server + background tasks) instead of the neutralised one in conftest.py

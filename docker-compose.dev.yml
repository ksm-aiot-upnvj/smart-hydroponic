# Local development stack (bundled database + api + client on one network).
#
# This file bundles its own `db` service, so `PGHOST: db` and
# `depends_on: db` are valid here — everything shares `hydroponic_network`.
# The production stack does NOT: see docker-compose.prod.yml.
#
# Copy .env.example to .env first (`docker compose --env-file .env ...`).
services:
  db:
    image: timescale/timescaledb:2.24.0-pg18
    container_name: timescaledb
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    ports:
      # Host port (POSTGRES_HOST_PORT) -> container port (POSTGRES_INTERNAL_PORT).
      # Never map "${POSTGRES_HOST_PORT}:${POSTGRES_HOST_PORT}".
      - "${POSTGRES_HOST_PORT:-5433}:${POSTGRES_INTERNAL_PORT:-5432}"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE} -h localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hydroponic_network

  api:
    build: ./backend
    container_name: hydroponic-backend
    env_file:
      - .env
    environment:
      # In-network database coordinates override whatever `.env` holds for the
      # host, and DATABASE_URL is blanked so Settings rebuilds it from these
      # values instead of reusing a host-oriented URL such as localhost:5433.
      PGHOST: db
      PGPORT: ${POSTGRES_INTERNAL_PORT:-5432}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      DATABASE_URL: ""
      COAP_HOST: "0.0.0.0"
    ports:
      - "8000:8000"
      - "8683:8683/udp"
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hydroponic_network

  client:
    build: ./frontend-vue
    container_name: hydroponic-frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - hydroponic_network

volumes:
  timescale_data:

networks:
  hydroponic_network:
    name: hydroponic_network
    driver: bridge

name: Build & Push Frontend on Release

on:
  workflow_run:
    workflows: ["release-frontend"]
    types:
      - completed
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Frontend Docker Image
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smart-hydroponic-frontend
            context: frontend-vue
            file: frontend-vue/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
          else
            tag="$(git tag -l 'frontend-v*' --sort=-v:refname | head -n 1)"
          fi

          if [[ -z "$tag" ]]; then
            echo "::error::No frontend release tag found. Expected a tag matching 'frontend-v*'."
            exit 1
          fi

          git checkout --detach "$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (optional for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_RELEASE }}

      - name: Build & Push (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.name }}:${{ steps.release_tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy and verify frontend
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: portainer-smart-hydroponic-deploy
      queue: max
    steps:
      - name: Trigger Portainer deployment
        shell: bash
        env:
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_SMART_HYDROPONIC_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [[ -z "$PORTAINER_WEBHOOK" ]]; then
            echo "::error::PORTAINER_SMART_HYDROPONIC_WEBHOOK_URL is not configured."
            exit 1
          fi

          http_status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 30 \
            --request POST "$PORTAINER_WEBHOOK")"

          if [[ "$http_status" != "200" && "$http_status" != "204" ]]; then
            echo "::error::Portainer webhook returned HTTP $http_status."
            exit 1
          fi

          echo "Portainer accepted the deployment trigger (HTTP $http_status)."

      - name: Wait for frontend availability
        shell: bash
        run: |
          set -euo pipefail

          health_url="https://aiot.fik.upnvj.ac.id/dashboard-hidroponik/"
          timeout_seconds=180
          poll_interval_seconds=10
          required_successes=3
          consecutive_successes=0
          elapsed=0

          sleep 10
          elapsed=10
          while (( elapsed < timeout_seconds )); do
            if curl --silent --show-error --fail --output /dev/null \
              --connect-timeout 3 --max-time 5 "$health_url"; then
              ((consecutive_successes += 1))
              if (( consecutive_successes >= required_successes )); then
                echo "Frontend returned a successful HTTP response."
                exit 0
              fi
            else
              consecutive_successes=0
            fi

            sleep "$poll_interval_seconds"
            ((elapsed += poll_interval_seconds))
          done

          echo "::error::Frontend did not become available within ${timeout_seconds}s."
          exit 1

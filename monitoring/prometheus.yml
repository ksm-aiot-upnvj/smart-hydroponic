global:
  scrape_interval: 15s

# Alert rules are evaluated by Prometheus itself. Without an Alertmanager the
# rules still fire and are visible under http://localhost:9090/alerts, but they
# are not routed anywhere until Alertmanager is added with a real delivery
# configuration (see docs/troubleshooting.md, "Metrik dan Alert").
rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Application metrics from the FastAPI backend (`/metrics`, audit finding
  # M-1), reached through the Docker host gateway. This default matches the
  # development stack (docker-compose.dev.yml publishes 8000:8000 on all
  # interfaces). The production stack publishes the API on 127.0.0.1 only, so
  # `host.docker.internal:8000` will NOT reach it — there, attach Prometheus to
  # the application network and scrape `hydroponic-backend:8000` instead. See
  # docs/troubleshooting.md ("Metrik dan Alert").
  - job_name: 'hydroponic_backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
